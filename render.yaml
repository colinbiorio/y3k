# Render Blueprint — one-click reproducible deploy.
# In Render: New + → Blueprint → connect this repo. Everything is baked in here.
# There are no secret keys to set: the site has no AI or voice key of its own
# (2026-10-12). Each person thinks on their own key or their own Claude sign-in,
# and speaks on their own voice key. An ANTHROPIC_API_KEY or ELEVENLABS_API_KEY
# left in the dashboard is never read — delete it there, and revoke the key.
services:
  - type: web
    name: y3k
    runtime: node
    plan: starter            # always-on. Use "free" to trial (sleeps when idle → ~30s cold start).
    buildCommand: npm install # no real deps; just produces a lockfile
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Persistent disk: account data + the session-signing secret live here, OUTSIDE
    # the app directory — the app dir is rebuilt from git on every deploy, which is
    # what kept wiping accounts. (Trade-off: disks make deploys briefly non-zero-
    # downtime; fine for this app.)
    disk:
      name: orion-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR            # auth.mjs writes .accounts.json/.session_secret here
        value: /data
      - key: MODEL               # the default for a person's own Anthropic key
        value: claude-opus-4-8
      - key: EFFORT
        value: xhigh
      - key: RATE_MAX
        value: "30"
